name: DB CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'schema/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finly_test
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: finly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Validate schema
        run: |
          PGPASSWORD=testpass psql -h localhost -U finly_test -d finly_test -f schema/001_initial_schema.sql
        env:
          PGPASSWORD: testpass

      - name: Validate migrations
        run: |
          for f in migrations/*.sql; do
            echo "Running $f..."
            PGPASSWORD=testpass psql -h localhost -U finly_test -d finly_test -f "$f"
          done

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=finly-db
            -Dsonar.sources=.
        continue-on-error: true

  deploy:
    name: Deploy
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Run migrations on production
        if: github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ Error: DATABASE_URL secret is not configured in GitHub Secrets."
            echo "Please add DATABASE_URL (e.g., your Neon PostgreSQL connection string) to your GitHub Repository Secrets."
            exit 1
          fi
          
          # Strip trailing/leading whitespaces, carriage returns, and newlines
          SANITIZED_DATABASE_URL=$(echo "$DATABASE_URL" | tr -d '\r\n[:space:]')
          
          # Clean DATABASE_URL by removing channel_binding parameter for compatibility
          CLEAN_DATABASE_URL=$(echo "$SANITIZED_DATABASE_URL" | sed 's/[?&]channel_binding=[^&]*//g')
          
          # Neon compute wake-up retry loop (handles cold starts)
          echo "Connecting to Neon Database..."
          DB_CONNECTED=false
          for i in {1..12}; do
            echo "Checking database connection (attempt $i/12)..."
            if psql "$CLEAN_DATABASE_URL" -c "SELECT 1;" > /dev/null 2>&1; then
              echo "✅ Database connection established successfully!"
              DB_CONNECTED=true
              break
            fi
            echo "⏳ Database is not ready yet. Waiting 5 seconds..."
            sleep 5
          done
          
          if [ "$DB_CONNECTED" != "true" ]; then
            echo "❌ Error: Failed to connect to the database after 60 seconds."
            exit 2
          fi
          
          # Check if database is already initialized (e.g., has users table)
          echo "Checking if database is initialized..."
          TABLE_EXISTS=$(psql "$CLEAN_DATABASE_URL" -t -A -c "SELECT to_regclass('public.users');" 2>/dev/null || echo "")
          
          if [ -z "$TABLE_EXISTS" ] || [ "$TABLE_EXISTS" = "null" ]; then
            echo "Database is not initialized. Applying initial schema first..."
            psql "$CLEAN_DATABASE_URL" -f schema/001_initial_schema.sql
          else
            echo "Database already initialized. Skipping schema creation."
          fi
          
          # Run incremental migrations
          for f in migrations/*.sql; do
            echo "Applying $f..."
            psql "$CLEAN_DATABASE_URL" -f "$f"
          done
